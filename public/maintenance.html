<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d0c"><title>Nova — Maintenance Mode</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080a09;color:#f4f6f5}body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.backdrop{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.07),transparent 42%),linear-gradient(135deg,#0b0d0c,#111514);filter:blur(3px);transform:scale(1.05)}.veil{position:fixed;inset:0;background:rgba(4,6,5,.68);backdrop-filter:blur(10px)}.card{position:relative;z-index:2;text-align:center;width:min(92vw,520px);padding:44px 28px}.warning{font-size:42px;line-height:1;margin:0 auto 13px;animation:warningPulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,210,70,.18))}h1{direction:ltr;font-size:32px;letter-spacing:-.7px;margin:0 0 27px;font-weight:800}.tools{width:118px;height:118px;margin:0 auto 28px;position:relative}.gear{position:absolute;inset:8px;border:13px dotted #f4f6f5;border-radius:50%;animation:spin 4s linear infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.16))}.gear:after{content:"";position:absolute;inset:27px;border:9px solid #f4f6f5;border-radius:50%;background:#080a09}.wrench{position:absolute;font-size:54px;left:31px;top:31px;animation:wrench 2.2s ease-in-out infinite}.dots{display:inline-flex;gap:5px;margin-right:5px}.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}p{margin:0;color:#aeb6b2;font-size:14px;line-height:1.9}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wrench{0%,100%{transform:rotate(-18deg) translateY(0)}50%{transform:rotate(18deg) translateY(-4px)}}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}@keyframes warningPulse{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.1);opacity:1}}
</style></head><body><div class="backdrop"></div><div class="veil"></div><main class="card"><div class="warning">⚠️</div><h1>Maintenance Mode</h1><div class="tools"><div class="gear"></div><div class="wrench">🔧</div></div><p>سایت در حال آپدیت است، لطفاً بعداً مجدداً تلاش کنید<span class="dots"><i></i><i></i><i></i></span></p></main></body></html>
